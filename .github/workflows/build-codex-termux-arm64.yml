name: build-codex-termux-arm64

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: flatten-mcp-tools-for-non-namespace-providers
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
          use-cache: false

      - name: Install musl build tools
        env:
          TARGET: aarch64-unknown-linux-musl
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      - name: Configure aws-lc for musl
        run: |
          set -euo pipefail
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_aarch64-unknown-linux-musl"
          target_no_jitter="${target_no_jitter//-/_}"
          echo "${target_no_jitter}=1" >> "$GITHUB_ENV"

      - name: Verify isolated host and ARM64 toolchains
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          rustup target list --installed
          zig version

          echo "HOST CC=$CC"
          command -v "$CC"
          "$CC" --version

          echo "HOST CXX=$CXX"
          command -v "$CXX"
          "$CXX" --version

          echo "TARGET CC=$CC_AARCH64_UNKNOWN_LINUX_MUSL"
          command -v "$CC_AARCH64_UNKNOWN_LINUX_MUSL"
          "$CC_AARCH64_UNKNOWN_LINUX_MUSL" -dumpmachine || true

          echo "TARGET CXX=$CXX_AARCH64_UNKNOWN_LINUX_MUSL"
          command -v "$CXX_AARCH64_UNKNOWN_LINUX_MUSL"
          "$CXX_AARCH64_UNKNOWN_LINUX_MUSL" -dumpmachine || true

          echo "TARGET LINKER=$CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER"
          command -v "$CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER"
          "$CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER" --version

          test "$CC" = "gcc"
          test "$CXX" = "g++"
          test -n "$CC_AARCH64_UNKNOWN_LINUX_MUSL"
          test -n "$CXX_AARCH64_UNKNOWN_LINUX_MUSL"
          test "$CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER" = "$CC_AARCH64_UNKNOWN_LINUX_MUSL"

          rustc --print target-libdir --target aarch64-unknown-linux-musl

          # Hard fail if the target compiler/linker ever resolves to host x86_64.
          probe_dir="$(mktemp -d)"
          trap 'rm -rf "$probe_dir"' EXIT
          printf 'int main(void){return 0;}\n' > "$probe_dir/probe.c"
          "$CC_AARCH64_UNKNOWN_LINUX_MUSL" "$probe_dir/probe.c" -o "$probe_dir/probe"
          file "$probe_dir/probe" | tee "$probe_dir/probe.file"
          grep -Eq 'ARM aarch64|AArch64' "$probe_dir/probe.file"
          ! grep -Eq 'x86-64|x86_64' "$probe_dir/probe.file"
          readelf -l "$probe_dir/probe" | grep -F '/lib/ld-musl-aarch64.so.1' >/dev/null
          "$CXX_AARCH64_UNKNOWN_LINUX_MUSL" --version
          echo "ARM64 musl compiler/linker probe: PASS"

      - name: Configure Rusty V8 artifact
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: aarch64-unknown-linux-musl

      - name: Verify Rusty V8 environment
        run: |
          set -euo pipefail
          test -s "$RUSTY_V8_ARCHIVE"
          test -s "$RUSTY_V8_SRC_BINDING_PATH"
          ls -lh "$RUSTY_V8_ARCHIVE" "$RUSTY_V8_SRC_BINDING_PATH"

      - name: Build Codex CLI
        working-directory: codex-rs
        run: |
          set -euo pipefail
          cargo build --locked --release -p codex-cli --bin codex --target aarch64-unknown-linux-musl

      - name: Verify ARM64 binary
        run: |
          set -euo pipefail
          BINARY="codex-rs/target/aarch64-unknown-linux-musl/release/codex"
          test -x "$BINARY"
          file "$BINARY"
          ls -lh "$BINARY"

      - name: Package Termux ARM64 binary
        run: |
          set -euo pipefail
          BINARY="codex-rs/target/aarch64-unknown-linux-musl/release/codex"
          rm -rf dist
          mkdir -p dist
          cp "$BINARY" dist/codex
          chmod 0755 dist/codex
          tar -C dist -czf dist/codex-termux-arm64.tar.gz codex
          sha256sum dist/codex dist/codex-termux-arm64.tar.gz > dist/SHA256SUMS
          cat dist/SHA256SUMS
          ls -lh dist/

      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-termux-arm64
          path: dist/
          if-no-files-found: error
