name: build-codex-termux-arm64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: flatten-mcp-tools-for-non-namespace-providers

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install AArch64 musl cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            musl-tools \
            gcc-aarch64-linux-gnu

      - name: Configure AArch64 musl compiler
        run: |
          sudo ln -sf "$(which aarch64-linux-gnu-gcc)" /usr/local/bin/aarch64-linux-musl-gcc
          which aarch64-linux-musl-gcc
          aarch64-linux-musl-gcc --version

      - name: Configure Cargo linker
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-musl]
          linker = "aarch64-linux-musl-gcc"
          EOF

      - name: Verify Rust target
        run: |
          rustc --version
          cargo --version
          rustup target list --installed
          rustc --print target-libdir --target aarch64-unknown-linux-musl

      - name: Build Codex CLI
        working-directory: codex-rs
        env:
          CC_aarch64_unknown_linux_musl: aarch64-linux-musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-musl-gcc
        run: |
          cargo build --release -p codex-cli --target aarch64-unknown-linux-musl

      - name: Package binary
        run: |
          mkdir -p dist
          cp codex-rs/target/aarch64-unknown-linux-musl/release/codex dist/codex
          tar -czf dist/codex-termux-arm64.tar.gz -C dist codex
          sha256sum dist/codex dist/codex-termux-arm64.tar.gz > dist/SHA256SUMS

      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-termux-arm64
          path: dist/
